[project]
name = "hazelst"
version = "0.1.0"
description = "Hazel St Forecast: a daily ski forecast for the Ikon mountains of northern New England"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12",
]

[project.scripts]
hazelst = "hazelst.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hazelst"]

[tool.uv]
# Resolve only releases at least two weeks old (build-plan Fallbacks).
# Move this date forward deliberately when upgrading dependencies.
exclude-newer = "2026-11-12T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["prototype", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
