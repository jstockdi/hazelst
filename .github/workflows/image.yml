name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}

env:
  IMAGE: ghcr.io/jstockdi/hazelst

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build (amd64)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: scripts/smoke.sh "$IMAGE:$GITHUB_SHA"

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Print the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image: $IMAGE:$GITHUB_SHA"
          echo "digest: $IMAGE@$DIGEST"
          {
            echo "### Image"
            echo
            echo "- tag: \`$IMAGE:$GITHUB_SHA\`"
            echo "- digest: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
